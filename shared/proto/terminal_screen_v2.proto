syntax = "proto3";

package webterm.terminal.screen.v2;

option go_package = "webterm/go-core/internal/screenprotocol/generatedv2";
option java_package = "com.webterm.terminal.protocol.generated";
option java_outer_classname = "TerminalScreenV2Proto";

// webterm.screen.v2 是 Android 远程终端渲染逻辑通道协议。
// 物理 WebSocket 仍使用 webterm.mux.v1；一个 binary frame 对应一个 envelope。
message ScreenEnvelope {
  uint32 protocol_version = 1; // 固定为 2
  // 6/7 曾为 WS HistoryRange request/response；冷历史改走 HTTP Segment。
  reserved 4, 5, 6, 7, 8, 9, 15, 18;

  oneof payload {
    Hello hello = 2;
    Baseline baseline = 3;
    AcquireLayout acquire_layout = 10;
    LayoutLease layout_lease = 11;
    ReleaseLayout release_layout = 12;
    Resize resize = 13;
    TerminalInput input = 14;
    TerminalEffect effect = 16;
    ClipboardResponse clipboard_response = 17;
    Exit exit = 19;
    Ping ping = 20;
    Pong pong = 21;
    TerminalCommit terminal_commit = 22;
    ResumeAccepted resume_accepted = 23;
  }
}

message Hello {
  reserved 1, 2, 3, 5, 6;
  ResumeToken resume = 4;
  Geometry desired_geometry = 7;
  uint32 cold_history_tail_lines = 8;
  InitialSyncMode initial_sync_mode = 9;
}

enum InitialSyncMode {
  INITIAL_SYNC_MODE_AUTO = 0;
  INITIAL_SYNC_MODE_FORCE_BASELINE = 1;
}

message ResumeScreenLine {
  uint64 line_id = 1;
  uint64 line_version = 2;
}

message ResumeToken {
  string instance_id = 1;
  uint64 layout_epoch = 2;
  uint64 screen_revision = 3;
  uint64 dictionary_generation = 4;
  uint64 history_generation = 5;
  uint64 contiguous_history_tail_last_seq = 6;
  BufferKind active_buffer = 7;
  repeated ResumeScreenLine active_rows = 8;
  // Inclusive start of the recent, locally contiguous history tail.
  uint64 contiguous_history_tail_first_seq = 9;
}

message ResumeAccepted {
  string instance_id = 1;
  uint64 layout_epoch = 2;
  uint64 screen_revision = 3;
  uint64 dictionary_generation = 4;
  uint64 history_generation = 5;
  HistoryExtent history_extent = 6;
}

message Geometry {
  int32 rows = 1;
  int32 cols = 2;
}

enum BufferKind {
  BUFFER_KIND_UNSPECIFIED = 0;
  BUFFER_KIND_MAIN = 1;
  BUFFER_KIND_ALTERNATE = 2;
}

// 空历史使用 first_seq=last_seq+1，例如初始空历史 1..0。
message HistoryExtent {
  uint64 first_seq = 1;
  uint64 last_seq = 2;
}

message Dictionary {
  repeated TerminalStyle styles = 1;
  repeated Hyperlink links = 2;
}

message HistoryTail {
  HistoryExtent extent = 1;
  repeated LineData lines = 2; // extent 最后至多 128 行
}

message Baseline {
  string session_id = 1;
  string instance_id = 2;
  uint64 layout_epoch = 3;
  uint64 screen_revision = 4;
  reserved 5;
  Geometry geometry = 6;
  BufferKind active_buffer = 7;
  HistoryExtent history_extent = 8;
  HistoryTail history_tail = 9;
  ScreenLayout screen_layout = 10;
  repeated LineData screen_lines = 11;
  Cursor cursor = 12;
  Modes modes = 13;
  TerminalPalette palette = 14;
  Dictionary dictionary = 15;
  uint64 dictionary_generation = 16;
  uint64 history_generation = 17;
  BaselineHistoryPolicy history_policy = 18;
  // sealed_through_seq 是已封存不可变段的最大 HistorySeq；0 表示尚无封存。
  // trim/tail 水位仍由 history_extent 表达。
  uint64 sealed_through_seq = 19;
}

enum BaselineHistoryPolicy {
  BASELINE_HISTORY_POLICY_RESET = 0;
  BASELINE_HISTORY_POLICY_PRESERVE_COMPATIBLE = 1;
}

// TerminalCommit 原子描述一个投影聚合窗口结束时的全部可观察变化。
message TerminalCommit {
  string instance_id = 1;
  uint64 layout_epoch = 2;
  reserved 3;
  uint64 base_revision = 4;
  uint64 revision = 5;
  ScreenMutation screen = 6;
  HistoryMutation history = 7;
  Cursor cursor = 8;
  Modes modes = 9;
  TerminalPalette palette = 10;
  Dictionary dictionary_additions = 11;
  optional BufferKind active_buffer = 12;
  uint64 dictionary_generation = 13;
  uint64 history_generation = 14;
}

message ScreenMutation {
  ScreenScroll scroll = 1;
  repeated ScreenRowWrite writes = 2;
}

message ScreenScroll {
  int32 top_row = 1;
  int32 bottom_row_exclusive = 2;
  int32 delta_rows = 3;
}

message ScreenRowWrite {
  int32 row = 1;
  LineData line = 2;
}

message HistoryMutation {
  HistoryExtent final_extent = 1;
  repeated LineData appended_lines = 2;
  repeated HistoryPromotion promotions = 3;
  // sealed_through_seq 是已封存不可变段的最大 HistorySeq；0 表示尚无封存。
  uint64 sealed_through_seq = 4;
}

message HistoryPromotion {
  uint64 line_id = 1;
  uint64 line_version = 2;
  uint64 history_seq = 3;
}

message ScreenLayout {
  repeated uint64 line_ids = 1;
}

message LineData {
  uint64 line_id = 1;
  uint64 line_version = 2;
  bool wrapped = 3;
  bytes utf8_text = 4;
  repeated StyleSpan style_spans = 5;
  reserved 6;
  uint64 history_seq = 7;
  bytes glyph_meta = 8;
}

message StyleSpan {
  int32 start_col = 1;
  int32 end_col = 2;
  uint32 style_id = 3;
  uint32 link_id = 4;
}

message Color {
  ColorKind kind = 1;
  int32 index = 2;
  uint32 rgb = 3;
}

enum ColorKind {
  COLOR_KIND_UNSPECIFIED = 0;
  COLOR_KIND_DEFAULT_FG = 1;
  COLOR_KIND_DEFAULT_BG = 2;
  COLOR_KIND_CURSOR = 3;
  COLOR_KIND_INDEXED = 4;
  COLOR_KIND_RGB = 5;
}

message TerminalStyle {
  uint32 id = 1;
  Color fg = 2;
  Color bg = 3;
  Color underline_color = 4;
  CellAttrs attrs = 5;
}

message CellAttrs {
  bool bold = 1;
  bool dim = 2;
  bool italic = 3;
  bool underline = 4;
  bool double_underline = 5;
  bool curly_underline = 6;
  bool dotted_underline = 7;
  bool dashed_underline = 8;
  bool blink_slow = 9;
  bool blink_fast = 10;
  bool reverse = 11;
  bool hidden = 12;
  bool strike = 13;
}

message Hyperlink {
  uint32 id = 1;
  string uri = 2;
  string params = 3;
}

message Cursor {
  int32 row = 1;
  int32 col = 2;
  bool visible = 3;
  CursorShape shape = 4;
  bool blink = 5;
}

enum CursorShape {
  CURSOR_SHAPE_UNSPECIFIED = 0;
  CURSOR_SHAPE_BLOCK = 1;
  CURSOR_SHAPE_BAR = 2;
  CURSOR_SHAPE_UNDERLINE = 3;
}

message Modes {
  bool application_cursor = 1;
  bool application_keypad = 2;
  bool bracketed_paste = 3;
  MouseTracking mouse_tracking = 4;
  MouseEncoding mouse_encoding = 5;
  bool focus_reporting = 6;
}

enum MouseTracking {
  MOUSE_TRACKING_UNSPECIFIED = 0;
  MOUSE_TRACKING_NONE = 1;
  MOUSE_TRACKING_X10 = 2;
  MOUSE_TRACKING_VT200 = 3;
  MOUSE_TRACKING_VT200_HIGHLIGHT = 4;
  MOUSE_TRACKING_BUTTON_EVENT = 5;
  MOUSE_TRACKING_ANY_EVENT = 6;
  MOUSE_TRACKING_SGR_PIXELS = 7;
}

enum MouseEncoding {
  MOUSE_ENCODING_UNSPECIFIED = 0;
  MOUSE_ENCODING_X10 = 1;
  MOUSE_ENCODING_UTF8 = 2;
  MOUSE_ENCODING_SGR = 3;
  MOUSE_ENCODING_URXVT = 4;
}

message TerminalPalette {
  Color default_fg = 1;
  Color default_bg = 2;
  Color cursor_color = 3;
  bool reverse_video = 4;
  repeated IndexedPaletteColor indexed_colors = 5;
  uint64 generation = 6;
}

message IndexedPaletteColor {
  int32 index = 1;
  uint32 rgb = 2;
}

message AcquireLayout {
  string request_id = 1;
  bool interactive = 2;
}

message LayoutLease {
  string request_id = 1;
  string lease_id = 2;
  bool granted = 3;
  bool interactive = 4;
  Geometry geometry = 5;
  uint64 expires_at_ms = 6;
}

message ReleaseLayout {
  string lease_id = 1;
}

message Resize {
  int32 cols = 1;
  int32 rows = 2;
  string lease_id = 3;
  string request_id = 4;
}

message TerminalInput {
  string lease_id = 1;
  reserved 2, 3;
  oneof input {
    TextInput text = 10;
    KeyInput key = 11;
    PasteInput paste = 12;
    MouseInput mouse = 13;
    FocusInput focus = 14;
  }
}

message TextInput { string data = 1; }

message KeyInput {
  string key = 1;
  ModifierSet modifiers = 2;
  bool pressed = 3;
}

message PasteInput { string data = 1; }

message MouseInput {
  int32 row = 1;
  int32 col = 2;
  MouseButton button = 3;
  int32 wheel_delta = 4;
  ModifierSet modifiers = 5;
  bool pressed = 6;
}

enum MouseButton {
  MOUSE_BUTTON_UNSPECIFIED = 0;
  MOUSE_BUTTON_LEFT = 1;
  MOUSE_BUTTON_MIDDLE = 2;
  MOUSE_BUTTON_RIGHT = 3;
  MOUSE_BUTTON_WHEEL = 4;
  MOUSE_BUTTON_MOVE = 5;
}

message FocusInput { bool focused = 1; }

message ModifierSet {
  bool shift = 1;
  bool alt = 2;
  bool ctrl = 3;
  bool meta = 4;
}

message TerminalEffect {
  string instance_id = 1;
  uint64 screen_revision = 2;
  reserved 11, 12, 16, 17;
  oneof effect {
    Bell bell = 10;
    ClipboardReadRequest clipboard_read = 13;
    ClipboardWriteRequest clipboard_write = 14;
    DesktopNotification notification = 15;
  }
}

message Bell {}
message ClipboardReadRequest {
  string request_id = 1;
  string clipboard = 2;
}
message ClipboardWriteRequest {
  string request_id = 1;
  string clipboard = 2;
  bytes data = 3;
}
message DesktopNotification {
  string title = 1;
  string body = 2;
}

message ClipboardResponse {
  string request_id = 1;
  bool allowed = 2;
  bool timeout = 3;
  bytes data = 4;
}

message Exit { int32 code = 1; }
message Ping { uint64 screen_revision = 1; }
message Pong { uint64 screen_revision = 1; }
