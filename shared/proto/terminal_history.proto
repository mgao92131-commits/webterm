syntax = "proto3";

package webterm.terminal.screen.v3;

option go_package = "webterm/go-core/internal/screenprotocol/generatedv3";
option java_package = "com.webterm.terminal.protocol.generated";
option java_outer_classname = "TerminalHistoryProto";
option optimize_for = LITE_RUNTIME;

import "shared/proto/terminal_screen_v3.proto";

// HTTP 历史正文批量拉取（不经 ScreenEnvelope）。
message LineBodyBatchRequest {
  string instance_id = 1;
  repeated LineKey keys = 2;
}

enum LineBodyBatchStatus {
  LINE_BODY_BATCH_STATUS_UNSPECIFIED = 0;
  LINE_BODY_BATCH_STATUS_OK = 1;
  LINE_BODY_BATCH_STATUS_STALE = 2;
  LINE_BODY_BATCH_STATUS_SESSION_GONE = 3;
  LINE_BODY_BATCH_STATUS_RETRYABLE = 4;
}

message LineBodyBatchResponse {
  string instance_id = 1;
  repeated LineBodyRecord bodies = 2;
  repeated LineKey missing_keys = 3;
  Dictionary dictionary = 4;
  LineBodyBatchStatus status = 5;
  uint64 layout_epoch = 6;
  uint64 history_generation = 7;
  uint32 retry_after_ms = 8;
}
