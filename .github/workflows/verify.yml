name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    name: Go test and vet
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go-core/go.mod
          cache-dependency-path: go-core/go.sum
      - run: go test ./...
      - run: go vet ./...

  go-race:
    name: Go race detector
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go-core/go.mod
          cache-dependency-path: go-core/go.sum
      - run: go test -race ./...

  go-windows-build:
    name: Windows cross build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go-core/go.mod
          cache-dependency-path: go-core/go.sum
      # Ubuntu 不能运行 Windows test binary；这里只验证所有生产包和两个发布入口
      # 的 Windows 编译边界。ConPTY/Named Pipe 行为由后续 windows-latest 集成任务覆盖。
      - run: GOOS=windows GOARCH=amd64 go build ./...
      - run: GOOS=windows GOARCH=amd64 go build ./cmd/webterm-agent
      - run: GOOS=windows GOARCH=amd64 go build ./cmd/webterm

  windows-runtime:
    name: Windows IPC and ConPTY runtime
    runs-on: windows-latest
    defaults:
      run:
        working-directory: go-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go-core/go.mod
          cache-dependency-path: go-core/go.sum
      # 预构建 webterm：pty 的 PowerShell hook 测试会在运行时 go build ./cmd/webterm，
      # 共享 runner 冷构建可能耗尽测试自身的 90s deadline；先构建让缓存命中。
      - run: go build ./cmd/webterm ./cmd/webterm-agent
      # 三个包拆成独立步骤，失败时能直接定位到具体包。
      - run: go test -v ./internal/localipc
      - run: go test -v ./internal/infrastructure/pty
      - run: go test -v ./internal/session

  android:
    name: Android test lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      # diag 变体基于 release 且开启 minify/资源压缩，必须进 CI 才能持续验证 R8 不裁剪诊断类。
      - run: ./gradlew :terminal-renderer:testDebugUnitTest :terminal-model:test \
          :terminal-runtime:testDebugUnitTest lintDebug assembleDebug assembleDiag \
          --no-daemon --console=plain
      - run: git diff --check

  android-renderer-instrumentation:
    name: Android renderer instrumentation API ${{ matrix.api-level }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Run renderer instrumentation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: medium_phone
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim
          script: cd android-client && ./gradlew :terminal-renderer:connectedDebugAndroidTest --no-daemon --console=plain

  android-renderer-performance:
    name: Android renderer performance artifacts API 36
    runs-on: ubuntu-latest
    timeout-minutes: 35
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Run opt-in renderer benchmarks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: medium_phone
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim
          script: >-
            cd android-client && ./gradlew :terminal-renderer:connectedDebugAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.webtermPerf=true
            --no-daemon --console=plain
      - name: Upload renderer benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-renderer-performance-api36
          if-no-files-found: warn
          path: |
            android-client/terminal-renderer/build/outputs/androidTest-results/**
            android-client/terminal-renderer/build/reports/androidTests/**

  generated-protocol:
    name: Generated protocol is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go-core/go.mod
          cache-dependency-path: go-core/go.sum
      - run: go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
        working-directory: go-core
      # 仓库内置 protoc 仅支持 macOS arm64；CI 使用与生成物版本戳一致的 Linux 版。
      - name: Install protoc 29.2
        run: |
          curl -sSL -o /tmp/protoc.zip https://github.com/protocolbuffers/protobuf/releases/download/v29.2/protoc-29.2-linux-x86_64.zip
          sudo unzip -o /tmp/protoc.zip -d /usr/local
          protoc --version
      - run: scripts/generate-proto.sh
      - run: git diff --exit-code -- go-core/internal/screenprotocol/generatedv2/terminal_screen_v2.pb.go android-client/terminal-protocol/src/main/java/com/webterm/terminal/protocol/generated/TerminalScreenV2Proto.java

  generated-cli-docs:
    name: Generated CLI docs are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go-core/go.mod
          cache-dependency-path: go-core/go.sum
      - run: go generate ./cmd/...
        working-directory: go-core
      - run: git diff --exit-code -- go-core/docs/cli
